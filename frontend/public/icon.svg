<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <defs>
    <!-- Nền gradient chuyển sắc Cam sang Xanh dương -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Gradient màu ví da nâu cam -->
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <linearGradient id="walletFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Gradient tiền giấy xanh -->
    <linearGradient id="moneyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="moneyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Gradient heo đất hồng -->
    <linearGradient id="piggyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Gradient đồng xu vàng -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Đổ bóng nhẹ -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. NỀN ICON BO GÓC SQUIRCLE -->
  <rect width="120" height="120" rx="30" fill="url(#bgGradient)"/>

  <!-- 2. BIỂU ĐỒ TĂNG TRƯỞNG & MŨI TÊN (Phía sau bên trái) -->
  <g opacity="0.95" filter="url(#softShadow)">
    <rect x="18" y="70" width="10" height="18" rx="3" fill="#60a5fa"/>
    <rect x="31" y="56" width="10" height="32" rx="3" fill="#34d399"/>
    <rect x="44" y="42" width="10" height="46" rx="3" fill="#10b981"/>

    <path d="M 16 68 Q 30 52 42 38 T 66 18" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <polygon points="62,13 72,16 66,25" fill="#22c55e"/>
  </g>

  <!-- 3. TỜ TIỀN GIẤY XANH NHÔ RA TỪ VÍ -->
  <g filter="url(#softShadow)">
    <rect x="30" y="34" width="32" height="22" rx="3" fill="url(#moneyGrad1)" transform="rotate(-10 46 45)"/>
    <circle cx="45" cy="44" r="4" fill="#a7f3d0" opacity="0.7"/>

    <rect x="38" y="38" width="34" height="24" rx="3" fill="url(#moneyGrad2)" transform="rotate(6 55 50)"/>
    <circle cx="56" cy="49" r="4.5" fill="#ecfdf5" opacity="0.8"/>
  </g>

  <!-- 4. CHÚ HEO ĐẤT TIẾT KIỆM (Phía phải) -->
  <g filter="url(#softShadow)">
    <ellipse cx="84" cy="68" rx="19" ry="17" fill="url(#piggyGrad)"/>
    <polygon points="76,53 82,46 84,54" fill="#fb7185"/>
    <ellipse cx="98" cy="69" rx="6" ry="5" fill="#fda4af"/>
    <circle cx="96" cy="69" r="1.2" fill="#be123c"/>
    <circle cx="99.5" cy="69" r="1.2" fill="#be123c"/>
    <circle cx="89" cy="63" r="2.2" fill="#1e293b"/>
    <circle cx="90" cy="62.2" r="0.8" fill="#ffffff"/>
    <rect x="73" y="82" width="6" height="6" rx="2" fill="#e11d48"/>
    <rect x="87" y="82" width="6" height="6" rx="2" fill="#e11d48"/>
  </g>

  <!-- 5. CHIẾC VÍ DA NÂU CAM Ở TRUNG TÂM -->
  <g filter="url(#softShadow)">
    <rect x="22" y="52" width="46" height="40" rx="8" fill="url(#walletGrad)"/>
    <path d="M 22 60 C 22 55.6 25.6 52 30 52 L 60 52 C 64.4 52 68 55.6 68 60 L 68 66 C 68 70.4 64.4 74 60 74 L 30 74 C 25.6 74 22 70.4 22 66 Z" fill="url(#walletFlap)"/>
    <rect x="52" y="66" width="18" height="12" rx="4" fill="#ea580c"/>
    <circle cx="63" cy="72" r="3.2" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  </g>

  <!-- 6. CHỒNG ĐỒNG XU VÀNG Ở GÓC DƯỚI -->
  <g filter="url(#softShadow)">
    <ellipse cx="80" cy="95" rx="14" ry="6" fill="#b45309"/>
    <ellipse cx="80" cy="92" rx="14" ry="6" fill="url(#goldGrad)"/>
    <ellipse cx="80" cy="88" rx="14" ry="6" fill="#b45309"/>
    <ellipse cx="80" cy="85" rx="14" ry="6" fill="url(#goldGrad)"/>
    <ellipse cx="80" cy="81" rx="14" ry="6" fill="#b45309"/>
    <ellipse cx="80" cy="78" rx="14" ry="6" fill="url(#goldGrad)"/>
    <text x="80" y="81.5" font-size="8" font-weight="900" fill="#78350f" text-anchor="middle" font-family="system-ui">₫</text>

    <ellipse cx="98" cy="93" rx="10" ry="5" fill="#b45309"/>
    <ellipse cx="98" cy="90" rx="10" ry="5" fill="url(#goldGrad)"/>
    <text x="98" y="93" font-size="6.5" font-weight="900" fill="#78350f" text-anchor="middle" font-family="system-ui">₫</text>
  </g>

  <!-- 7. TIA LẤP LÁNH (Sparkle ✨) -->
  <path d="M 102 24 Q 102 30 96 30 Q 102 30 102 36 Q 102 30 108 30 Q 102 30 102 24 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="24" cy="22" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
