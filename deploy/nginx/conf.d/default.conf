# ==============================================================================
# NGINX REVERSE PROXY & STATIC FILE SERVING CHO FINANCE TRACKER (SPEC 5.3)
# ==============================================================================

# Định nghĩa upstream backend
upstream backend_app {
    server backend:5000;
    keepalive 32;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificates (Tự động thay bằng đường dẫn chứng chỉ Let's Encrypt / Cloudflare)
    # ssl_certificate /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL Protocols & Ciphers chuẩn bảo mật cao
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers cấp độ Reverse Proxy
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Nén Gzip cho nội dung tĩnh
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Thư mục gốc chứa frontend static build
    root /usr/share/nginx/html;
    index index.html;

    # 1. Reverse Proxy cho toàn bộ API routes và Health Check sang Backend
    location ~ ^/(api|health) {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;

        # Truyền đúng IP thực của người dùng và giao thức HTTPS cho backend rate limit & cookie Secure
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (nếu cần trong tương lai)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer & Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        # Không cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # 2. Service Worker và PWA manifest (tuyệt đối không lưu cache dài hạn để cập nhật ngay)
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # 3. Tài nguyên tĩnh có hash phiên bản (JS, CSS, fonts, images) -> Cache dài hạn
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. Single Page Application (SPA) fallback cho React Router
    location / {
        try_files $uri $uri/ /index.html;
        # index.html không được cache dài hạn để luôn nạp phiên bản JS/CSS mới nhất
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

